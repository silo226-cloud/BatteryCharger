name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK (ANDROID_HOME).
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret SIGNING_KEYSTORE_BASE64. Without a fixed key, new versions cannot install over the old app. See README."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ChargeMonitor.apk

      - name: Write version.json
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          jq -n \
            --argjson code $((100 + GITHUB_RUN_NUMBER)) \
            --arg name "1.$GITHUB_RUN_NUMBER" \
            --arg notes "$( (printf '%s' "${COMMIT_MSG:-$(git log -1 --format=%s)}") | head -n 1)" \
            '{versionCode: $code, versionName: $name, notes: $notes, apk: "ChargeMonitor.apk"}' > version.json
          cat version.json

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ChargeMonitor.apk version.json \
            --target "$GITHUB_SHA" \
            --title "מד טעינה 1.$GITHUB_RUN_NUMBER" \
            --notes "הורידו את ChargeMonitor.apk לטלפון והתקינו. האפליקציה בודקת עדכונים לבד ומתריעה על גרסה חדשה."
